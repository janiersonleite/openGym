# Builds an installable Android APK of this fork, on demand (Actions > "Android APK" > Run workflow).
# It is the debug build of the sideload flavour: signed with the automatic debug key, so there is
# no keystore to keep, and it installs next to the official openGym (its own app id ends in
# ".test"), each with its own data. Move your data across with Settings > Data & backup:
# export in the old app, import in this one. The 180 px exercise media of the repository are packed
# in, the only size the licence allows in a CI run (NOTICE.md).
name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          add-job-summary: on-failure
      - name: Build the app and copy it into the Android project
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build:mobile
      - name: Build the APK
        working-directory: frontend/android
        run: ./gradlew --no-daemon assembleSideloadDebug
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: openGym-apk
          path: frontend/android/app/build/outputs/apk/sideload/debug/*.apk
          if-no-files-found: error
          retention-days: 30
